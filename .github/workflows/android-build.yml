name: Build ScreenPilot Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify Gradle
        run: ./gradlew --version

      - name: Compile ScreenPilot
        run: ./gradlew :app:compileDebugKotlin --rerun-tasks

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --rerun-tasks

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --rerun-tasks

      - name: Run lint
        run: ./gradlew :app:lintDebug --rerun-tasks

      - name: Upload ScreenPilot APK
        uses: actions/upload-artifact@v6
        with:
          name: ScreenPilot-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ScreenPilot-build-reports
          path: |
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
